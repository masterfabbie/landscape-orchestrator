[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "landscape-orchestrator"
version = "0.1.0"
description = "Orchestrierung von SAP-Systemlandschaften über SAP Host Agent und sapstartsrv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "cryptography>=42",
    "defusedxml>=0.7",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
lo-keygen = "landscape_orchestrator.crypto:keygen"
lo-mock = "landscape_orchestrator.mock.server:main"
lo-server = "landscape_orchestrator.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/landscape_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
