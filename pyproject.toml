[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "landscape-orchestrator"
version = "0.1.0"
description = "Orchestrierung von SAP-Systemlandschaften über SAP Host Agent und sapstartsrv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
lo-mock = "landscape_orchestrator.mock.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/landscape_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
