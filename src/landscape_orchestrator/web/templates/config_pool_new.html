{% extends "base.html" %}
{% block title %}{{ t("pool.add") }}{% endblock %}
{% block content %}
<p class="crumbs"><a href="/configuration/pools">{{ t("tab.pools") }}</a></p>
<h1>{{ t("pool.add") }}</h1>
<section class="card">
  <form method="post" action="/configuration/pools" class="stack">
    <p class="muted">{{ t("pool.explanation") }}</p>
    <div class="fields">
      <label>{{ t("field.name") }} <input name="name" required maxlength="64" autofocus></label>
      <label>{{ t("field.description") }} <input name="description" maxlength="1000"></label>
    </div>
    <div class="row">
      <button type="submit">{{ t("pool.add") }}</button>
      <a href="/configuration/pools">{{ t("mass.cancel") }}</a>
    </div>
  </form>
</section>
{% endblock %}
