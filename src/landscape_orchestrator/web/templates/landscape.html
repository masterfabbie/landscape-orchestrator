{% extends "base.html" %}
{% block title %}{{ t("nav.landscape") }}{% endblock %}
{% block head %}
  <link rel="stylesheet" href="{{ asset_url('landscape.css') }}">
  <script type="module" src="{{ asset_url('landscape.js') }}"></script>
{% endblock %}
{% block content %}
{# Rendered by the React app (frontend/src/landscape); the start data is read, not run. #}
<script type="application/json" id="lo-boot">{{ boot | tojson }}</script>
<div id="lo-landscape">
  <p class="muted">{{ t("ui.loading") }}</p>
  <noscript><p class="flash error">{{ t("ui.needs_javascript") }}</p></noscript>
</div>
{% endblock %}
